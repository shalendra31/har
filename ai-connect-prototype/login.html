<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Verizon AI Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    function showPasswordStep(event) {
      event.preventDefault();
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      if (email) {
        document.getElementById('email-section').style.display = 'none';
        document.getElementById('password-section').style.display = 'block';
        document.getElementById('user-email').textContent = email;
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</head>
<body>
  <div class="login-container" style="display: flex; height: 100vh;">
    <div class="login-left" style="flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 2rem;">
      <img src="network.png" alt="Network Intelligence Orchestration Diagram" style="max-width: 100%; height: auto; border-radius: 20px; box-shadow: 0 0 20px rgba(255,0,0,0.1);">
    </div>

    <div class="login-right" style="flex: 1; background: #f9f9f9; padding: 4rem; display: flex; flex-direction: column; justify-content: center;">
      <div class="login-logo" style="display: flex; align-items: center; gap: 0.75rem; font-size: 1.1rem; font-weight: 700; margin-bottom: 2rem;">
        <img src="logo.png" alt="Verizon AI Connect" style="height: 36px;">
        Verizon AI Connect
      </div>

      <form id="email-section" onsubmit="showPasswordStep(event)" style="max-width: 400px; width: 100%;">
        <h2 style="margin-bottom: 0.5rem;">Login to your Account</h2>
        <p style="margin-bottom: 1.5rem; color: #555;">Enter your email to continue</p>

        <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Email *</label>
        <input type="email" id="email" placeholder="Enter your email" required style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; margin-bottom: 1rem;" />

        <button class="btn-primary" type="submit" style="width: 100%; padding: 0.75rem; font-size: 1rem; background: #d00000; color: white; border: none; border-radius: 6px; margin-bottom: 1.5rem;">Continue</button>

        <div class="divider" style="text-align: center; margin: 1rem 0; position: relative;">
          <hr style="border: none; height: 1px; background: #ccc;">
          <span style="position: absolute; left: 50%; top: -0.6rem; transform: translateX(-50%); background: #f9f9f9; padding: 0 0.5rem; font-size: 0.85rem; color: #555;">OR</span>
        </div>

        <button type="button" class="google-btn" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 0.7rem; font-size: 1rem; background: white; border: 1px solid #ccc; border-radius: 6px;">
          <img src="google.png" alt="Google logo" style="width: 20px; height: 20px;">
          Sign in with Google
        </button>

        <div class="links" style="margin-top: 2rem; font-size: 0.9rem; text-align: center; display: flex; flex-direction: column; gap: 0.5rem;">
          <a href="#" style="color: #0071e3;">Join your company account</a>
          <a href="#" style="color: #0071e3;">Create a new account</a>
          <a href="#" style="color: #0071e3;">Get help signing in</a>
        </div>
      </form>

      <form id="password-section" style="display: none; max-width: 400px; width: 100%;" onsubmit="handleLogin(event)">
        <h2 style="margin-bottom: 0.5rem;">Login to your Account</h2>
        <p id="user-email" class="user-email" style="font-weight: 600; margin-bottom: 1rem;"></p>

        <label for="password">Password *</label>
        <div class="password-wrapper" style="position: relative;">
          <input type="password" id="password" placeholder="Enter your password" style="width: 100%; padding: 0.75rem; padding-right: 2.5rem; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; margin-bottom: 0.5rem;" />
          <span class="password-toggle" style="position: absolute; right: 12px; top: 12px; cursor: pointer;">👁️</span>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 1rem;">
          <a href="#" style="color: #0071e3;">Get help signing in</a>
          <a href="#" style="color: #0071e3;">Forgot Password</a>
        </div>

        <button class="btn-primary" type="submit" style="width: 100%; padding: 0.75rem; font-size: 1rem; background: #d00000; color: white; border: none; border-radius: 6px; margin-top: 0.5rem;">Continue</button>

        <div class="divider" style="text-align: center; margin: 1.5rem 0; position: relative;">
          <hr style="border: none; height: 1px; background: #ccc;">
          <span style="position: absolute; left: 50%; top: -0.6rem; transform: translateX(-50%); background: #f9f9f9; padding: 0 0.5rem; font-size: 0.85rem; color: #555;">OR</span>
        </div>

        <button class="watch-demo" type="button" onclick="location.reload()" style="width: 100%; padding: 0.7rem; font-size: 1rem; background: white; color: #111; border: 1px solid #ccc; border-radius: 6px;">Back</button>
      </form>
    </div>
  </div>
</body>
</html>
